<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Online Image Compressor | Govt Exam Forms <20KB & <50KB</title>
  <meta name="description" content="Quickly compress images online for SSC, UPSC, and Railway forms under 20KB or 50KB.">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; background: linear-gradient(90deg, #10b981, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p.subtitle { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #334155; border-radius: 12px; padding: 30px 15px; text-align: center; cursor: pointer; transition: 0.3s; background: #0f172a; }
    .upload-box:hover { border-color: #10b981; }
    input[type="file"] { display: none; }
    .preset-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-preset { flex: 1; padding: 8px; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-preset:hover { background: #10b981; color: #0f172a; }
    .slider-box { margin-top: 20px; display: none; }
    .slider-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: #cbd5e1; }
    input[type="range"] { width: 100%; height: 6px; border-radius: 3px; accent-color: #10b981; cursor: pointer; }
    .preview-container { display: none; margin-top: 20px; text-align: center; }
    img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 10px; }
    .info { font-size: 14px; color: #10b981; margin-bottom: 15px; font-weight: 700; }
    .btn-download { background: linear-gradient(90deg, #10b981, #06b6d4); color: #0f172a; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 700; font-size: 15px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Squeeze Image Utility</h1>
    <p class="subtitle">Compress images for Govt Forms (&lt;20KB / &lt;50KB)</p>

    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 32px; margin-bottom: 8px;">📁</div>
      <span style="font-size: 14px; color: #cbd5e1;">Tap to Choose Photo</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="slider-box" id="sliderBox">
      <div class="preset-btns">
        <button class="btn-preset" onclick="setTargetSize(20)">Target &lt; 20KB</button>
        <button class="btn-preset" onclick="setTargetSize(50)">Target &lt; 50KB</button>
      </div>

      <div style="margin-top: 15px;" class="slider-header">
        <span>Compression Quality</span>
        <span id="qualityVal">70%</span>
      </div>
      <input type="range" id="qualitySlider" min="1" max="100" value="70">
    </div>

    <div class="preview-container" id="previewContainer">
      <img id="imagePreview" src="#" alt="Compressed Preview">
      <div class="info" id="fileInfo">Size: -- KB</div>
      <button class="btn-download" id="downloadBtn">Download Image</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const sliderBox = document.getElementById('sliderBox');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const fileInfo = document.getElementById('fileInfo');
    const downloadBtn = document.getElementById('downloadBtn');

    let rawImage = null;
    let compressedBlob = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        rawImage = new Image();
        rawImage.src = event.target.result;
        rawImage.onload = () => {
          sliderBox.style.display = 'block';
          previewContainer.style.display = 'block';
          processCompression();
        };
      };
      reader.readAsDataURL(file);
    });

    qualitySlider.addEventListener('input', () => {
      qualityVal.textContent = qualitySlider.value + '%';
      processCompression();
    });

    function setTargetSize(targetKb) {
      if (!rawImage) return;
      let q = 0.7;
      if (targetKb === 20) q = 0.15;
      else if (targetKb === 50) q = 0.35;
      qualitySlider.value = Math.round(q * 100);
      qualityVal.textContent = qualitySlider.value + '%';
      processCompression(targetKb);
    }

    function processCompression(targetKb = null) {
      if (!rawImage) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let q = qualitySlider.value / 100;

      let maxDim = 1200;
      if (q < 0.3 || targetKb === 20) maxDim = 400;
      else if (q < 0.5 || targetKb === 50) maxDim = 650;

      let scale = Math.min(1, maxDim / Math.max(rawImage.width, rawImage.height));
      canvas.width = rawImage.width * scale;
      canvas.height = rawImage.height * scale;

      ctx.drawImage(rawImage, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        compressedBlob = blob;
        imagePreview.src = URL.createObjectURL(blob);
        const kbSize = (blob.size / 1024).toFixed(1);
        fileInfo.textContent = `Size: ${kbSize} KB`;
      }, 'image/jpeg', q);
    }

    downloadBtn.addEventListener('click', () => {
      if (!compressedBlob) return;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(compressedBlob);
      link.download = 'compressed-image.jpg';
      link.click();
    });
  </script>
</body>
</html>
