<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squeeze Image Utility</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1329; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
    .card { background: #131c38; border: 1px solid #1f2d52; border-radius: 20px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    h1 { font-size: 20px; font-weight: 700; text-align: center; color: #38bdf8; margin-bottom: 4px; }
    p.subtitle { color: #94a3b8; font-size: 12px; text-align: center; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #1e293b; border-radius: 12px; padding: 35px 20px; text-align: center; cursor: pointer; background: #0f172a; transition: all 0.2s ease; }
    .upload-area:hover { border-color: #38bdf8; background: #152238; }
    .folder-icon { font-size: 36px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; font-weight: 600; color: #cbd5e1; }
    .upload-formats { font-size: 11px; color: #64748b; margin-top: 4px; }
    input[type="file"] { display: none; }
    
    .preset-container { display: flex; gap: 8px; margin-top: 15px; }
    .preset-btn { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #38bdf8; font-size: 12px; font-weight: 600; cursor: pointer; }
    .preset-btn:hover { background: #38bdf8; color: #0f172a; }

    .controls-box { margin-top: 18px; display: none; }
    .slider-info { display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
    input[type="range"] { width: 100%; height: 6px; border-radius: 3px; accent-color: #10b981; cursor: pointer; }

    .preview-box { display: none; margin-top: 15px; text-align: center; }
    .preview-box img { max-width: 100%; max-height: 180px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 12px; }
    .file-size { font-size: 15px; font-weight: 700; color: #10b981; margin-bottom: 15px; }
    .btn-download { width: 100%; background: #10b981; color: #0b1329; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-download:hover { background: #34d399; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Squeeze Image Utility</h1>
    <p class="subtitle">Compress Images for Govt Forms (&lt;20KB / &lt;50KB)</p>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div class="folder-icon">📂</div>
      <div class="upload-text">Tap to Choose Photo</div>
      <div class="upload-formats">Supports JPG, PNG, WEBP</div>
      <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">
    </div>

    <div class="controls-box" id="controlsBox">
      <div class="preset-container">
        <button class="preset-btn" onclick="applyTarget(20)">Target &lt; 20KB</button>
        <button class="preset-btn" onclick="applyTarget(50)">Target &lt; 50KB</button>
      </div>

      <div style="margin-top: 15px;" class="slider-info">
        <span>Compression Quality</span>
        <span id="qualityText">70%</span>
      </div>
      <input type="range" id="qualitySlider" min="1" max="100" value="70">
    </div>

    <div class="preview-box" id="previewBox">
      <img id="imagePreview" src="" alt="Compressed Preview">
      <div class="file-size" id="fileSizeText">Size: -- KB</div>
      <button class="btn-download" id="downloadBtn">Download Image</button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const controlsBox = document.getElementById('controlsBox');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityText = document.getElementById('qualityText');
    const previewBox = document.getElementById('previewBox');
    const imagePreview = document.getElementById('imagePreview');
    const fileSizeText = document.getElementById('fileSizeText');
    const downloadBtn = document.getElementById('downloadBtn');

    let loadedImg = null;
    let finalBlob = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        loadedImg = new Image();
        loadedImg.src = evt.target.result;
        loadedImg.onload = () => {
          controlsBox.style.display = 'block';
          previewBox.style.display = 'block';
          compressImage();
        };
      };
      reader.readAsDataURL(file);
    });

    qualitySlider.addEventListener('input', () => {
      qualityText.textContent = qualitySlider.value + '%';
      compressImage();
    });

    function applyTarget(targetKb) {
      if (!loadedImg) return;
      let targetQuality = targetKb === 20 ? 15 : 35;
      qualitySlider.value = targetQuality;
      qualityText.textContent = targetQuality + '%';
      compressImage(targetKb);
    }

    function compressImage(targetKb = null) {
      if (!loadedImg) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let quality = qualitySlider.value / 100;

      let maxDimension = 1200;
      if (quality < 0.25 || targetKb === 20) maxDimension = 400;
      else if (quality < 0.45 || targetKb === 50) maxDimension = 600;

      let width = loadedImg.width;
      let height = loadedImg.height;

      if (width > maxDimension || height > maxDimension) {
        if (width > height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(loadedImg, 0, 0, width, height);

      canvas.toBlob((blob) => {
        finalBlob = blob;
        imagePreview.src = URL.createObjectURL(blob);
        const kbSize = (blob.size / 1024).toFixed(1);
        fileSizeText.textContent = `Size: ${kbSize} KB`;
      }, 'image/jpeg', quality);
    }

    downloadBtn.addEventListener('click', () => {
      if (!finalBlob) return;
      const downloadUrl = URL.createObjectURL(finalBlob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = 'compressed-image.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  </script>
</body>
</html>
